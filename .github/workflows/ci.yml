name: CI

on:
  push:
  pull_request:
  schedule:
    # Every Monday, so new advisories for the locked versions show up even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Core + agent extra only: no torch, no Chainlit, no model downloads.
      - name: Install
        run: uv sync --locked --extra agent

      - name: Tests (offline, no LLM)
        run: uv run pytest -q

      - name: Demo evals (rule-based fallback)
        run: uv run helm-eval --fresh-demo

      - name: MCP server check on the demo data
        run: |
          uv run helm-demo
          uv run helm-mcp --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Every locked package, all extras included, checked against the PyPI advisory database.
      - name: Dependency audit
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
