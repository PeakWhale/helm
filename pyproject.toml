[project]
name = "peakwhale-helm"
version = "0.2.0"
description = "Local-first research assistant and MCP server that answers questions from your own database and documents, with sources."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "duckdb", "rag", "langgraph", "ollama", "research-assistant"]
dependencies = [
    "duckdb>=1.4.3",
    "mcp>=1.24.0",
    "pypdf>=6.4.2",
    # DuckDB needs pytz to return TIMESTAMPTZ values (and now()) to Python.
    "pytz>=2024.1",
    "reportlab>=4.4.6",
]

[project.optional-dependencies]
# LLM planner (LangGraph tool-calling agent, Ollama or any OpenAI-compatible API)
agent = [
    "langgraph>=1.0.5",
    "langchain-core>=1.2.2",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.5",
    "langchain-mcp-adapters>=0.2.1",
]
# Chainlit chat UI (includes the agent)
ui = [
    "peakwhale-helm[agent]",
    "chainlit>=2.9.3",
]
# Optional stock price fallback through yfinance
market = [
    "yfinance>=0.2.66",
]
# Heavy local models: FinBERT sentiment and embedding search (downloads torch)
ml = [
    "sentence-transformers>=5.2.0",
    "transformers>=4.57.3",
    "torch>=2.9.1",
]
all = [
    "peakwhale-helm[ui,market,ml]",
]

[project.scripts]
helm-mcp = "peakwhale_helm.mcp_server:main"
helm-demo = "peakwhale_helm.demo:main"
helm-ask = "peakwhale_helm.cli:main"
helm-eval = "peakwhale_helm.evals:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peakwhale_helm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
